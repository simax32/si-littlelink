  <style>
    /* Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #36d1dc 10%, #5b86e5 90%);
      color: #ffffff;
      line-height: 1.6;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      text-align: center;
      padding: 20px;
    }

    .column {
      padding: 20px;
    }

    /* Header Styling */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      z-index: 10;
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }

    header h1 {
      font-size: 2rem;
      color: #fff;
    }

    header nav a {
      color: #f39c12;
      margin: 0 1.2rem;
      text-decoration: none;
      font-size: 1.1rem;
      text-transform: uppercase;
      position: relative;
      transition: color 0.3s ease;
    }

    header nav a::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 2px;
      background-color: #f39c12;
      bottom: -5px;
      left: 0;
      transform: scaleX(0);
      transition: transform 0.3s ease-in-out;
    }

    header nav a:hover::after {
      transform: scaleX(1);
    }

    header nav a:hover {
      color: #fff;
    }

    /* Avatar Image */
    .avatar {
      border-radius: 50%;
      width: 150px;
      height: 150px;
      margin-bottom: 1rem;
      border: 5px solid #f39c12;
    }

    /* Hero Section */
    .hero {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      background: url('https://source.unsplash.com/1600x900/?mountain,sky') no-repeat center center/cover;
      color: #fff;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
      animation: fadeIn 2s ease-in-out;
    }

    .hero h2 {
      font-size: 3.5rem;
      margin-bottom: 1.5rem;
      animation: bounceIn 1s ease-out;
    }

    .hero p {
      font-size: 1.4rem;
      width: 70%;
      margin: 0 auto;
      line-height: 1.8;
      animation: fadeIn 2s ease-in-out;
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
      }

      100% {
        opacity: 1;
      }
    }

    @keyframes bounceIn {
      0% {
        transform: translateY(-30px);
        opacity: 0;
      }

      50% {
        transform: translateY(15px);
        opacity: 1;
      }

      100% {
        transform: translateY(0);
      }
    }

    /* Button Styles */
    .button {
      display: inline-flex;
      align-items: center;
      padding: 0.6rem 1.2rem;
      border-radius: 25px;
      text-decoration: none;
      margin: 0.5rem 0;
      font-size: 1.2rem;
      font-weight: bold;
      color: white;
      background-color: #333;
      transition: background-color 0.3s ease;
    }

    .button:hover {
      background-color: #f39c12;
    }

    .button img {
      margin-right: 10px;
    }

    /* Footer */
    footer {
      background: rgba(0, 0, 0, 0.7);
      color: #f39c12;
      text-align: center;
      padding: 1.5rem;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
    }

    footer p {
      font-size: 1.1rem;
    }

    footer p a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s ease;
    }

    footer p a:hover {
      color: #f39c12;
    }
  </style>
